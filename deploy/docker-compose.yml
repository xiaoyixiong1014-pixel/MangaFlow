# =============================================================================
# 漫序 MangaFlow 一键部署编排（文件级说明）
#
# 用途   : docker compose -f deploy/docker-compose.yml up -d 一键拉起全套服务
# 服务   : postgres（pgvector）→ backend（FastAPI）→ web / admin-web（前端）
#          → nginx（统一网关入口）
# 上下文 : 全部自建镜像的 build context 均为仓库根（..），
#          以覆盖 mangaflow-design 本地共享包（前端 file: 依赖必需）
#
# 端口约定（宿主映射统一使用 1xxxx 高位，规避开发机已占用的
#           5432 / 8300 / 5173 / 5174 / 80；容器内端口互不冲突）：
#   宿主 15432 → postgres  5432 （宿主映射仅为本机调试用，生产建议关闭）
#   宿主 18300 → backend   8300 （宿主映射仅为冒烟/调试用）
#   宿主 15173 → web       80   （宿主映射仅为调试用，正常走网关）
#   宿主 15174 → admin-web 80   （宿主映射仅为调试用，正常走网关）
#   宿主 18080 → nginx     80   （★ 对外统一入口）
# =============================================================================

# compose 项目名（容器/网络/卷前缀，替代老版本 -p 参数）
name: mangaflow

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector：业务库与向量检索（RD-15 / MA-07）
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mf-postgres
    restart: unless-stopped
    environment:
      # 超级用户与业务库（init_db 亦会自动建库，此处显式声明便于 pg_isready 探活）
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 密码默认 123456（与 app/core/config.py 开发默认值一致，生产务必通过 deploy/.env 覆盖）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-mangaflow}
      TZ: Asia/Shanghai
    ports:
      # 宿主 15432 → 容器 5432（高位映射，不影响本机已运行的 5432 服务；
      # 生产环境建议删除此映射，仅保留容器内网访问）
      - "15432:5432"
    volumes:
      # 命名卷持久化业务数据（含后续 pgvector 向量列）
      - mf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 探活：库可接受连接即视为 healthy
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mangaflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [mf-net]

  # ---------------------------------------------------------------------------
  # FastAPI 后端：uvicorn 启动 app.main:app（容器内 8300）
  # ---------------------------------------------------------------------------
  backend:
    build:
      # 构建上下文 = 仓库根（backend.Dockerfile 内按 backend/ 相对路径 COPY）
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: mangaflow/backend:${IMAGE_TAG:-latest}
    container_name: mf-backend
    restart: unless-stopped
    environment:
      # 业务库连接串：由 POSTGRES_* 自动拼串（主机名为 compose 服务名 postgres；
      # 如需整串覆盖，请在 deploy/.env 设置 DATABASE_URL 并自行保证主机名/密码一致）
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-mangaflow}}
      # 管理库连接串（init_db 连 postgres 系统库自动创建 mangaflow 业务库）
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123456}@postgres:5432/postgres}
      # JWT 签名密钥（生产务必通过 deploy/.env 覆盖）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-mangaflow-dev-jwt-secret-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # 模型渠道 API Key 的 AES 加密密钥（生产务必覆盖）
      AES_KEY: ${AES_KEY:-mangaflow-aes-key-1234567890abcd}
      TZ: Asia/Shanghai
    ports:
      # 宿主 18300 → 容器 8300（高位映射，不影响本机已运行的 8300 服务；
      # 生产环境建议删除此映射，统一经网关 /api 访问）
      - "18300:8300"
    volumes:
      # 本地媒体存储持久化：config.storage_dir 默认按项目根解析为 /app/backend/storage
      - mf_storage:/app/backend/storage
    depends_on:
      # 等 postgres 健康后再启动，避免启动初期建库失败
      postgres:
        condition: service_healthy
    networks: [mf-net]

  # ---------------------------------------------------------------------------
  # 创作端（mangaflow-web）：vite 构建 + nginx 托管（容器内 80）
  # ---------------------------------------------------------------------------
  web:
    build:
      # 上下文必须为仓库根：构建需同时包含 mangaflow-design/ 与 mangaflow-web/
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # npm 镜像源（默认官方；国内构建在 deploy/.env 设 NPM_REGISTRY 覆盖）
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: mangaflow/web:${IMAGE_TAG:-latest}
    container_name: mf-web
    restart: unless-stopped
    ports:
      # 宿主 15173 → 容器 80（高位映射，不影响本机 5173 开发端口）
      - "15173:80"
    depends_on:
      # 前端为纯静态托管，无启动顺序强依赖；声明 backend 仅为编排语义完整
      backend:
        condition: service_started
    networks: [mf-net]

  # ---------------------------------------------------------------------------
  # 运营管理端（mangaflow-admin-web）：vite build --base=/admin/ + nginx 托管
  # ---------------------------------------------------------------------------
  admin-web:
    build:
      # 上下文必须为仓库根（理由同上）
      context: ..
      dockerfile: deploy/admin.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: mangaflow/admin-web:${IMAGE_TAG:-latest}
    container_name: mf-admin-web
    restart: unless-stopped
    ports:
      # 宿主 15174 → 容器 80（高位映射，不影响本机 5174 开发端口）
      - "15174:80"
    depends_on:
      backend:
        condition: service_started
    networks: [mf-net]

  # ---------------------------------------------------------------------------
  # Nginx 网关：统一对外入口（宿主 18080 → 容器 80）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mf-nginx
    restart: unless-stopped
    ports:
      # ★ 对外统一入口：http://<宿主IP>:18080
      - "18080:80"
    volumes:
      # 网关路由配置（/ → web、/admin/ → admin-web、/api 与 /storage → backend）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - web
      - admin-web
    networks: [mf-net]

# ---------------------------------------------------------------------------
# 命名卷：数据库数据 + 媒体存储（docker volume ls 查看；down 不删除，
# 需彻底清库用 docker compose down -v，谨慎操作）
# ---------------------------------------------------------------------------
volumes:
  mf_postgres_data:
  mf_storage:

# ---------------------------------------------------------------------------
# 容器网络：bridge 单网络，服务间以服务名互访（backend → postgres 等）
# ---------------------------------------------------------------------------
networks:
  mf-net:
    driver: bridge
