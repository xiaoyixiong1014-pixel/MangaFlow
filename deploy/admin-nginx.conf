# =============================================================================
# 漫序 MangaFlow 运营管理端站点配置（文件级说明）
#
# 用途   : 打包进 admin-web 镜像（deploy/admin.Dockerfile 阶段二），
#          作为 nginx 容器的 /etc/nginx/conf.d/default.conf
# 职责   : 托管 mangaflow-admin-web 构建产物（base=/admin/）+ SPA history 路由 fallback
# 请求来源: 网关（deploy/nginx.conf）将 "/admin/" 的请求原样反代到本容器；
#          本配置用 alias 剥掉 /admin/ 前缀，映射到镜像内的扁平 dist 目录
# =============================================================================

# 服务块：运营管理端静态站点
server {
    # 监听容器内 80 端口（对外宿主端口由 compose 映射为 15174，网关按 /admin/ 分流）
    listen 80;
    # 接收任意 Host（网关透传）
    server_name _;

    # 精确匹配 /admin（无尾斜杠）→ 规范化为 /admin/，避免相对路径歧义
    location = /admin {
        return 301 /admin/;
    }

    # 裸根访问（未带 /admin 前缀）→ 跳转到管理端入口（防止直连容器端口时 404）
    location = / {
        return 301 /admin/;
    }

    # 管理端主体：alias 将 URI 前缀 /admin/ 替换为站点根，
    # 即 /admin/foo → /usr/share/nginx/html/foo
    location /admin/ {
        alias /usr/share/nginx/html/;
        # 目录默认首页
        index index.html;
        # SPA history 路由 fallback：优先命中真实文件/目录，
        # 否则内部重定向到 /admin/index.html（仍落在本 location，alias 剥前缀后
        # 命中站点根的 index.html），交给 vue-router（base=/admin/）处理前端路由
        try_files $uri $uri/ /admin/index.html;
    }
}
