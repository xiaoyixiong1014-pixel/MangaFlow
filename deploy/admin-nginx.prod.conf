# =============================================================================
# 漫序 MangaFlow 运营管理端生产站点配置（文件级说明）
#
# 用途   : 生产编排（deploy/docker-compose.prod.yml）运行时卷挂载为 admin-web
#          容器的 /etc/nginx/conf.d/default.conf，覆盖镜像内置的 admin-nginx.conf
#          （后者面向开发网关拓扑，服务 /admin/ 子路径）。
# 职责   : 运营端独立端口形态（宿主 8007 → 容器 80，构建 base=/）下的——
#          1. 根路径托管 mangaflow-admin-web 构建产物 + SPA history 路由 fallback；
#          2. 反代 /api 与 /storage 到 backend 容器（含 SSE 流式支持）。
# =============================================================================

# ---- upstream：后端 API（服务名 = compose 服务名 backend，容器内端口 8300） ----
upstream mangaflow_api {
    server backend:8300;
    # 长连接复用，降低管理端高频列表/统计请求的建连开销
    keepalive 32;
}

# ---- 服务块：运营管理端站点 ----
server {
    # 监听容器内 80 端口（对外宿主端口由生产编排映射为 8007）
    listen 80;
    # 接收任意 Host（IP 直连访问）
    server_name _;

    # 大文件上传上限（运营端素材上传，对齐 V1.0 部署文档 200m）
    client_max_body_size 200m;

    # ---------- gzip 基础配置（4Mbps 小带宽下减小 JS/CSS 传输体积） ----------
    gzip on;
    # 小于 1KB 不压缩（收益低且可能负优化）
    gzip_min_length 1k;
    # 压缩级别 5（CPU 与压缩率的均衡点）
    gzip_comp_level 5;
    # 压缩类型：文本/样式/脚本/JSON/XML/SVG/字体
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    # 响应头追加 Vary: Accept-Encoding（代理/CDN 缓存正确性）
    gzip_vary on;

    # ---------- 代理公共参数（对 /api 与 /storage 生效） ----------
    # HTTP/1.1：SSE 分块传输与 keepalive 复用的前提
    proxy_http_version 1.1;
    # 清空 Connection 头：启用 upstream keepalive 长连接
    proxy_set_header Connection "";
    # 透传真实请求信息（后端日志与重定向使用）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- SSE 支持（通知推送 / 生成进度等流式端点） ----------
    # 关键：关闭响应缓冲，事件实时下发而非攒满再发
    proxy_buffering off;
    # 读超时 600s：长任务流式生成期间无数据也不中断（对齐 V1.0 部署文档）
    proxy_read_timeout 600s;
    # 写超时 600s：请求体较大时留足时间
    proxy_send_timeout 600s;
    # 透传后端的 X-Accel-Buffering 响应头（后端可按响应粒度控制缓冲）
    proxy_pass_header X-Accel-Buffering;

    # ---------- 后端 API（/api 前缀原样透传，FastAPI 路由自带 /api 前缀） ----------
    location /api/ {
        # proxy_pass 不带 URI → 保留完整原始路径（含 /api 前缀）
        proxy_pass http://mangaflow_api;
    }

    # ---------- 媒体文件（后端 StaticFiles 挂载的上传/生成素材） ----------
    location /storage/ {
        # 原样透传 /storage/xxx 给 backend
        proxy_pass http://mangaflow_api;
        # 媒体内容可客户端缓存 7 天（文件名含哈希，更新即换 URL）
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 静态资源长缓存（vite 产物带内容哈希，文件名变更即缓存失效） ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- SPA history 路由 fallback：优先命中真实文件/目录，
    # 否则回退 index.html 交给 vue-router（base=/）处理前端路由 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
