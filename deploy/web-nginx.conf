# =============================================================================
# 漫序 MangaFlow 创作端站点配置（文件级说明）
#
# 用途   : 打包进 web 镜像（deploy/web.Dockerfile 阶段二），
#          作为 nginx 容器的 /etc/nginx/conf.d/default.conf
# 职责   : 托管 mangaflow-web 构建产物 + SPA history 路由 fallback
# 请求来源: 网关（deploy/nginx.conf）将 "/" 的请求反代到本容器
# =============================================================================

# 服务块：创作端静态站点
server {
    # 监听容器内 80 端口（对外宿主端口由 compose 映射为 15173）
    listen 80;
    # 接收任意 Host（网关透传）
    server_name _;

    # 站点根目录：web.Dockerfile 中 COPY 的构建产物位置
    root /usr/share/nginx/html;
    # 默认首页
    index index.html;

    # 静态资源长缓存（vite 产物带内容哈希，文件名变更即缓存失效）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA history 路由 fallback：优先命中真实文件/目录，
    # 否则回退 index.html 交给 vue-router 处理前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
