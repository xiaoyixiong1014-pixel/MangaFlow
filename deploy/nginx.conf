# =============================================================================
# 漫序 MangaFlow 网关 Nginx 配置（文件级说明）
#
# 用途   : 统一对外入口（compose 中挂载为 nginx 容器的
#          /etc/nginx/conf.d/default.conf，宿主端口 18080 → 容器 80）
# 路由   : /        → 创作端（web 容器，SPA）
#          /admin/  → 运营管理端（admin-web 容器，SPA，base=/admin/）
#          /api/    → FastAPI 后端（backend 容器 8300，含 SSE 流式支持）
#          /storage/→ 后端静态媒体（上传/生成素材）
#
# 与部署文档 V1.0 §5.4 的对应关系：
#   - upstream 名由文档的 api:8000 调整为 backend:8300（本仓库端口约定）；
#   - 文档的 /media/ 本目录 alias 改为反代 backend 的 /storage 挂载
#     （当前代码由 FastAPI StaticFiles 服务媒体文件，与 vite dev 代理行为一致）；
#   - 文档的 /ws/ WebSocket 段暂不落库（当前代码仅 SSE 推送，无 WS 端点），
#     后续若新增 WS 端点，仿照 SSE 段加 Upgrade 头即可；
#   - SSE 支持对 /api 全局生效：proxy_buffering off + 600s 长超时 +
#     X-Accel-Buffering 响应头透传，比文档的独立 /api/stream/ 段更简单可靠。
# =============================================================================

# ---- upstream：后端 API（服务名 = compose 服务名 backend）----
upstream mangaflow_api {
    # 容器网络内 FastAPI 服务地址（容器内端口 8300）
    server backend:8300;
    # 长连接复用，降低高频 API 调用的建连开销
    keepalive 32;
}

# ---- upstream：创作端（web 容器内置 nginx）----
upstream mangaflow_web {
    server web:80;
    keepalive 16;
}

# ---- upstream：运营管理端（admin-web 容器内置 nginx）----
upstream mangaflow_admin {
    server admin-web:80;
    keepalive 16;
}

# ---- 服务块：对外统一入口 ----
server {
    # 监听容器内 80 端口（compose 映射宿主 18080，避免与本机 80 冲突）
    listen 80;
    # 接收任意 Host（生产可改为具体域名）
    server_name _;

    # 大文件上传上限（素材/视频/BGM 上传，对齐部署文档 200m）
    client_max_body_size 200m;

    # ---------- gzip 基础配置 ----------
    gzip on;
    # 小于 1KB 不压缩（收益低且可能负优化）
    gzip_min_length 1k;
    # 压缩级别 5（CPU 与压缩率的均衡点）
    gzip_comp_level 5;
    # 压缩类型：文本/样式/脚本/JSON/XML/SVG/字体
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;
    # 响应头追加 Vary: Accept-Encoding（CDN/代理缓存正确性）
    gzip_vary on;

    # ---------- 代理公共参数（对下方全部 location 生效） ----------
    # HTTP/1.1：SSE 分块传输与 keepalive 复用的前提
    proxy_http_version 1.1;
    # 清空 Connection 头：启用 upstream keepalive 长连接
    proxy_set_header Connection "";
    # 透传真实请求信息（后端日志与重定向使用）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- SSE 支持（通知推送 / 生成进度等流式端点） ----------
    # 关键：关闭响应缓冲，事件实时下发而非攒满再发
    proxy_buffering off;
    # 读超时 600s：长任务流式生成期间无数据也不中断（对齐部署文档）
    proxy_read_timeout 600s;
    # 写超时 600s：请求体较大时留足时间
    proxy_send_timeout 600s;
    # 透传后端的 X-Accel-Buffering 响应头（默认被 nginx 隐藏；
    # 透传后后端可按响应粒度精细控制缓冲行为）
    proxy_pass_header X-Accel-Buffering;

    # ---------- 后端 API（/api 前缀原样透传，FastAPI 路由自带 /api 前缀） ----------
    location /api/ {
        # proxy_pass 不带 URI → 保留完整原始路径（含 /api 前缀）
        proxy_pass http://mangaflow_api;
    }

    # ---------- 媒体文件（后端 StaticFiles 挂载的上传/生成素材） ----------
    location /storage/ {
        # 原样透传 /storage/xxx 给 backend
        proxy_pass http://mangaflow_api;
        # 媒体内容可客户端缓存 7 天（文件名含哈希，更新即换 URL）
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- 运营管理端（/admin/ 前缀原样透传，管理端镜像内剥前缀） ----------
    location /admin/ {
        proxy_pass http://mangaflow_admin;
    }

    # ---------- 创作端 SPA（默认入口，web 镜像内做 history fallback） ----------
    location / {
        proxy_pass http://mangaflow_web;
    }
}
