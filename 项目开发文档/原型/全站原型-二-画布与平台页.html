<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫序 MangaFlow · 全站原型（二）画布与平台页</title>
<style>
:root{
  --r-card:20px; --r-ctl:12px; --r-pill:999px;
  --bg:#F5F7F6; --surface:#FFFFFF; --surface-2:#FAFAF8; --surface-3:#EFF2F1;
  --border:rgba(0,0,0,.09); --border-strong:rgba(0,0,0,.16);
  --text:#14181A; --text-2:#5F6B68; --text-3:#8E9A97;
  --accent:#12B3A6; --accent-soft:rgba(18,179,166,.10);
  --ok:#1E9E6A; --ok-soft:rgba(30,158,106,.12);
  --warn:#B87100; --warn-soft:rgba(184,113,0,.13);
  --danger:#CE4343; --danger-soft:rgba(206,67,67,.12);
  --brand2:#7C6BF0; --brand2-soft:rgba(124,107,240,.12);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0E1112; --surface:#15191A; --surface-2:#1C2223; --surface-3:#111516;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.16);
  --text:#E8EDEA; --text-2:#9BA5A2; --text-3:#6B7573;
  --accent:#4FD8CA; --accent-soft:rgba(18,179,166,.18);
  --ok:#4CC38A; --ok-soft:rgba(76,195,138,.14);
  --warn:#E0A33A; --warn-soft:rgba(224,163,58,.14);
  --danger:#F0736F; --danger-soft:rgba(240,115,111,.14);
  --brand2:#9A8CF5; --brand2-soft:rgba(124,107,240,.20);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(127,127,127,.28);border-radius:5px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:252px;flex-shrink:0;background:var(--surface-3);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 15px}
.brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,var(--accent),#7C6BF0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand-name{font-weight:600;font-size:16px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
.nav-group{margin-bottom:15px}
.nav-group-title{font-size:12.5px;color:var(--text-3);padding:8px 8px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;width:100%;text-align:left;color:var(--text-2);position:relative;white-space:nowrap}
.nav-item:hover{background:rgba(127,127,127,.10);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-label{flex:1;font-size:15px}
.nav-badge{font-size:11.5px;padding:2px 7px;border-radius:var(--r-pill);background:rgba(127,127,127,.14);color:var(--text-3)}
.side-foot{border-top:1px solid var(--border);padding:10px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
.page-title{font-size:16px;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.points{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--text-2)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:hover{background:rgba(127,127,127,.12);color:var(--text)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#7C6BF0,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.content{flex:1;overflow-y:auto;padding-bottom:56px}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
.pad{padding:22px 26px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sec-head h2{font-size:16px;font-weight:600}
.sec-head .note{font-size:13px;color:var(--text-3)}
.sec-head .act{margin-left:auto;font-size:13.5px;color:var(--text-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--text-3);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-ctl);font-size:14.5px;border:1px solid var(--border);white-space:nowrap}
.btn:hover{background:rgba(127,127,127,.10)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;color:var(--text-2)}
.btn.sm{padding:6px 13px;font-size:13.5px;border-radius:10px}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:2px 9px;border-radius:var(--r-pill);background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent)}
.tag.o{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.d{background:var(--danger-soft);color:var(--danger)}
.tag.p{background:var(--brand2-soft);color:var(--brand2)}
.node.sel{box-shadow:0 0 0 2px var(--brand2), var(--shadow)}
.chip{padding:7px 15px;border-radius:var(--r-pill);font-size:14px;color:var(--text-2);border:1px solid var(--border);background:var(--surface)}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 16px}
.tab{padding:11px 14px;font-size:14.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.ph{border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;border:1px solid var(--border)}
.tile{aspect-ratio:1;border-radius:var(--r-ctl);position:relative;overflow:hidden;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.tile .tg{position:absolute;left:8px;bottom:7px;font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:rgba(0,0,0,.5)}
.empty{padding:34px 16px;border:1px dashed var(--border-strong);border-radius:var(--r-ctl);text-align:center;color:var(--text-3);font-size:14px}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-ctl);font-size:14px}
.banner.w{background:var(--warn-soft);color:var(--warn)}
.banner.d{background:var(--danger-soft);color:var(--danger)}
.banner.a{background:var(--accent-soft);color:var(--accent)}
.banner.o{background:var(--ok-soft);color:var(--ok)}
.inp{width:100%;padding:10px 13px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface-2);outline:0}
.lbl{font-size:13px;color:var(--text-3);margin-bottom:6px;display:block}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{text-align:left;font-weight:500;color:var(--text-3);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--border)}
.tb td{padding:11px 14px;border-bottom:1px solid var(--border)}
.tb tr:hover td{background:var(--surface-2)}
.bar{height:6px;border-radius:3px;background:rgba(127,127,127,.16);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.stat{padding:16px 18px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--border)}
.stat .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--text-3);margin-top:3px}
.sw-panel{position:fixed;top:70px;right:18px;z-index:220;width:300px;max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:10px;display:none}
.sw-panel.show{display:block}
.sw-float{position:fixed;right:18px;bottom:18px;z-index:210;padding:9px 16px;border-radius:var(--r-pill);background:var(--text);color:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;font-size:13.5px}
.sw-panel.show{display:block}
.sw-g{font-size:11.5px;color:var(--text-3);padding:8px 10px 5px}
.sw-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--text-2)}
.sw-i:hover{background:rgba(127,127,127,.10);color:var(--text)}
.sw-i.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sw-id{font-family:var(--mono);font-size:11.5px;opacity:.7;width:42px}
/* 画布 */
.cv{position:relative;height:calc(100vh - 62px - 44px);overflow:hidden;background:
  radial-gradient(circle,rgba(127,127,127,.22) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
.node{position:absolute;width:180px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.node .nh{padding:8px 11px;font-size:13px;font-weight:500;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
.node .nb{padding:10px 11px;font-size:12.5px;color:var(--text-2)}
.node.dirty .nh{background:var(--warn-soft);color:var(--warn)}
.node.cached .nh{background:var(--ok-soft);color:var(--ok)}
.node.running .nh{background:var(--accent-soft);color:var(--accent)}
.mini-map{position:absolute;right:16px;bottom:16px;width:150px;height:100px;background:var(--surface);border:1px solid var(--border);border-radius:10px;opacity:.9}
@media(max-width:1360px){.sidebar{width:68px}.brand-name,.nav-group-title,.nav-label,.nav-badge{display:none}.brand,.nav-item{justify-content:center;padding:10px 0}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">漫</div><div class="brand-name">漫序 MangaFlow</div></div>
    <nav class="nav">
      <div class="nav-group"><div class="nav-group-title">创作</div>
        <button class="nav-item" data-nav="W-01"><span class="nav-label">Agent</span></button></div>
      <div class="nav-group"><div class="nav-group-title">项目</div>
        <button class="nav-item" data-nav="W-02"><span class="nav-label">漫剧项目</span></button>
        <button class="nav-item" data-nav="C-01"><span class="nav-label">AI 画布</span></button>
        <button class="nav-item" data-nav="collab"><span class="nav-label">协作</span><span class="nav-badge">即将开放</span></button></div>
      <div class="nav-group"><div class="nav-group-title">资产</div>
        <button class="nav-item" data-nav="S-04"><span class="nav-label">角色与场景</span></button>
        <button class="nav-item" data-nav="P-03"><span class="nav-label">素材库</span></button>
        <button class="nav-item" data-nav="P-02"><span class="nav-label">提示词库</span></button></div>
      <div class="nav-group"><div class="nav-group-title">账户</div>
        <button class="nav-item" data-nav="P-04"><span class="nav-label">模型配置</span></button>
        <button class="nav-item" data-nav="P-05"><span class="nav-label">计费与配额</span></button>
        <button class="nav-item" data-nav="P-06"><span class="nav-label">个人中心</span></button></div>
    </nav>
    <div class="side-foot"><button class="nav-item" data-nav="help"><span class="nav-label">帮助</span></button></div>
  </aside>

  <div class="main">
    <header class="topbar"><div class="page-title" id="pageTitle">—</div>
      <div class="top-right">
        <button class="icon-btn" id="swTopBtn" title="切换页面">☰</button><span class="points">✦ <b>1,832</b></span>
        <button class="icon-btn">◔</button><button class="icon-btn" id="themeBtn">◐</button><span class="avatar">小</span></div>
    </header>
    <div class="content" id="host"></div>
  </div>
</div>
<div class="sw-panel" id="swPanel"></div>
<button class="sw-float" id="swBtn">☰ 切换页面</button>

<script>
var A="#12B3A6", G1="#12332F", G2="#1F3B3A", G3="#4A3320", G4="#2E2450", G5="#20304A", G6="#402A2A";
var P = {
  "C-01": { t:"画布列表", h:`
    <div class="pad">
      <div class="row" style="margin-bottom:18px">
        <input class="inp" style="max-width:240px" placeholder="搜索画布…">
        <button class="btn sm" style="margin-left:auto">导入 JSON</button><button class="btn primary sm">+ 新建画布</button>
      </div>
      <div class="sec-head"><h2>从模板开始</h2><span class="note">不给空白页，给三个起点</span></div>
      <div class="grid g3" style="margin-bottom:28px">
        <div class="card"><b>剧本 → 分镜图</b><div class="muted" style="margin:8px 0 12px">铺好剧本解析、分镜拆解、生图节点</div><button class="btn sm">使用模板</button></div>
        <div class="card"><b>角色三视图</b><div class="muted" style="margin:8px 0 12px">一次出正面 / 侧面 / 半身并并排对比</div><button class="btn sm">使用模板</button></div>
        <div class="card"><b>风格试验</b><div class="muted" style="margin:8px 0 12px">同提示词多风格批量对比</div><button class="btn sm">使用模板</button></div>
      </div>
      <div class="sec-head"><h2>我的画布</h2></div>
      <div class="grid g3">
        ${[["小林造型探索","来自：深夜便利店的相遇","10-08 14:20",G1],["便利店分镜精修","来自：分镜 #12","10-08 13:05",G5],["画风对比","独立画布","10-07 20:11",G4]].map(function(c){
          return '<div class="card"><div class="ph" style="aspect-ratio:16/10;background:linear-gradient(140deg,'+c[3]+','+A+');margin-bottom:12px"></div><div class="row"><b style="flex:1">'+c[0]+'</b></div><div class="muted" style="margin-top:6px">'+c[1]+' · '+c[2]+'</div><div class="row" style="gap:6px;margin-top:12px"><button class="btn sm">打开</button><button class="btn sm">重命名</button><button class="btn sm">复制</button><button class="btn sm">导出</button><button class="btn sm">删除</button></div></div>';}).join("")}
      </div>
      <div class="empty" style="margin-top:16px">空状态：还没有画布 → 试试从模板开始</div>
    </div>` },

  "C-02": { t:"画布编辑器", h:`
    <div style="height:calc(100vh - 60px);display:flex;flex-direction:column">
    <div class="row" style="padding:10px 18px;border-bottom:1px solid var(--border);gap:9px">
      <button class="btn sm">←</button><b>小林造型探索</b>
      <button class="btn sm">撤销</button><button class="btn sm">重做</button>
      <span class="tag">缩放 80% ▾</span><span class="tag">适配 F</span>
      <span class="muted">● 已自动保存 14:32</span>
      <span class="muted" style="margin-left:auto">运行：</span>
      <span class="chip on">运行选中</span><span class="chip">助手驱动</span><span class="chip">全图 DAG</span>
      <button class="btn sm">投递来源：分镜 #12</button><button class="btn primary sm">沉淀回流</button>
    </div>
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:92px minmax(0,1fr) 292px">
      <div style="border-right:1px solid var(--border);padding:10px;overflow-y:auto">
        <div class="muted" style="font-size:11.5px;margin-bottom:8px">节点</div>
        ${["文本","图像","视频","音频","生成","资产","分镜","合成","逻辑","分组"].map(function(n){
          return '<div class="ph" style="height:34px;margin-bottom:6px;font-size:12px">'+n+'</div>';}).join("")}
      </div>

      <div style="display:flex;flex-direction:column;min-height:0">
        <div class="cv" style="flex:1;min-height:0;height:auto">
          <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
            <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" style="stroke:var(--border-strong);stroke-width:1.6" stroke-linecap="round"/></marker></defs>
            <line x1="207" y1="104" x2="294" y2="104" style="stroke:var(--border-strong);stroke-width:1.6" marker-end="url(#ar)"/>
            <line x1="482" y1="104" x2="569" y2="104" style="stroke:var(--border-strong);stroke-width:1.6" marker-end="url(#ar)"/>
            <line x1="390" y1="160" x2="390" y2="209" style="stroke:var(--border-strong);stroke-width:1.6" marker-end="url(#ar)"/>
            <line x1="665" y1="160" x2="665" y2="209" style="stroke:var(--border-strong);stroke-width:1.6" marker-end="url(#ar)"/>
          </svg>
          <div class="node cached" style="left:25px;top:60px"><div class="nh">◈ 资产引用</div><div class="nb">小林（面部已锁）<br><span class="tag o" style="margin-top:6px">复用缓存</span></div></div>
          <div class="node dirty sel" style="left:300px;top:60px"><div class="nh">⚡ 生成节点 · 文生图</div><div class="nb">已修改 → 重算中<br><span class="tag w" style="margin-top:6px">脏节点</span></div></div>
          <div class="node cached" style="left:575px;top:60px"><div class="nh">⚡ 生成节点 · 图生图</div><div class="nb">风格迁移<br><span class="tag o" style="margin-top:6px">复用缓存</span></div></div>
          <div class="node" style="left:300px;top:215px"><div class="nh">▣ 图像节点</div><div class="nb"><div class="ph" style="height:64px;background:linear-gradient(140deg,${G1},${A});color:#fff">结果图</div></div></div>
          <div class="node" style="left:575px;top:215px"><div class="nh">▣ 图像节点</div><div class="nb"><div class="ph" style="height:64px;background:linear-gradient(140deg,${G4},#A55BB0);color:#fff">变体图</div></div></div>
          <div class="mini-map"><svg width="150" height="100"><rect x="8" y="14" width="34" height="18" rx="4" fill="#9C9C95"/><rect x="56" y="14" width="34" height="18" rx="4" fill="#B87100"/><rect x="104" y="14" width="34" height="18" rx="4" fill="#9C9C95"/><rect x="56" y="58" width="34" height="18" rx="4" fill="#9C9C95"/><rect x="104" y="58" width="34" height="18" rx="4" fill="#9C9C95"/></svg></div>
        </div>
        <div class="row" style="padding:10px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-3)">
          节点 5 · 连线 4 · 运行中 1　　自动保存 14:32
          <span style="margin-left:auto">增量执行：改「生成节点」只重算该节点与下游，上游复用缓存</span>
        </div>
      </div>

      <div style="border-left:1px solid var(--border);overflow-y:auto">
        <div class="tabs"><button class="tab on">检查器</button><button class="tab">画布助手</button></div>
        <div style="padding:16px">
          <b>生成节点 · 文生图</b>
          <label class="lbl" style="margin-top:14px">模型</label><select class="inp"><option>通用图像 ▾</option></select>
          <label class="lbl" style="margin-top:12px">引用资产</label><div class="row"><span class="tag a">小林（面部锁）</span><button class="btn sm">+</button></div>

function render(id){
  var p = P[id]; if(!p) return;
  document.getElementById('pageTitle').textContent = id + ' · ' + p.t;
  document.getElementById('host').innerHTML = p.h;
  document.getElementById('swBtn').style.display = 'none';
  __shellTheme = 'dark'; applyTheme();
  document.querySelectorAll('.sw-i').forEach(function(b){ b.classList.toggle('on', b.dataset.id === id); });
  document.querySelectorAll('.nav-item[data-nav]').forEach(function(b){ b.classList.toggle('active', b.dataset.nav === id); });
  if (id.indexOf('P-') === 0) document.querySelectorAll('.nav-item[data-nav="'+id+'"]').forEach(function(b){ b.classList.add('active'); });
}
function buildSwitcher(){
  var groups = [["AI 画布",["C-01","C-02"]],
                ["平台功能页",["P-01","P-02","P-03","P-04","P-05","P-06"]],
                ["官网与 Studio","见『全站原型（一）』"],
                ["运营管理端","见『全站原型（三）』"]];
  var html = '';
  groups.forEach(function(g){
    html += '<div class="sw-g">'+g[0]+'</div>';
    if (typeof g[1] === 'string'){
      html += '<div class="muted" style="padding:6px 10px;font-size:13px">'+g[1]+'</div>';
      return;
    }
    g[1].forEach(function(id){
      html += (P[id] ? '<button class="sw-i" data-id="'+id+'"><span class="sw-id">'+id+'</span>'+P[id].t+'</button>' : '');
    });
  });
  document.getElementById('swPanel').innerHTML = html;
  document.querySelectorAll('.sw-i').forEach(function(b){ b.addEventListener('click', function(){ render(b.dataset.id); }); });
}
function toggleSw(){ document.getElementById('swPanel').classList.toggle('show'); }
document.getElementById('swBtn').addEventListener('click', toggleSw);
var _st=document.getElementById('swTopBtn'); if(_st) _st.addEventListener('click', toggleSw);
document.addEventListener('click', function(e){
  var pn=document.getElementById('swPanel'); if(!pn.classList.contains('show')) return;
  if(pn.contains(e.target) || e.target.closest('#swBtn') || e.target.closest('#swTopBtn')) return;
  pn.classList.remove('show');
});
var __userTheme=null,__shellTheme='light';
function applyTheme(){document.documentElement.setAttribute('data-theme', __userTheme || __shellTheme);}
document.getElementById('themeBtn').addEventListener('click', function(){
  var c=document.documentElement.getAttribute('data-theme');
  __userTheme=(c==='dark')?'light':'dark'; applyTheme();
});
document.querySelectorAll('.nav-item[data-nav]').forEach(function(b){
  b.addEventListener('click', function(){
    var t = b.dataset.nav;
    if (P[t]) { render(t); return; }
    var m = { "W-01":"W-01 工作台（见『全站原型（一）』）","W-02":"W-02 项目列表（见『全站原型（一）』）",
              "S-04":"S-04 资产管理（见『全站原型（一）』）","collab":"协作功能本期不做（V-03 / V-04）","help":"帮助中心（原型未展开）" };
    alert(m[t] || t);
  });
});
buildSwitcher();
render("C-01");
