[pytest]
# pytest 全局配置：
# - asyncio_mode=auto：自动识别 async 测试函数与 async 夹具（pytest-asyncio）
# - loop scope 统一为 session：全部用例共享同一事件循环，
#   使进程内任务执行器（runner）可以作为常驻协程与用例并发运行
# - testpaths：默认只收集 tests/ 目录
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
